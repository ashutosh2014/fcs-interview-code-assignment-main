openapi: 3.0.0
info:
  title: Store API
  description: API for managing retail stores (synced to legacy after DB commit)
  version: 1.0.0

paths:
  /store:
    get:
      summary: List all stores
      responses:
        '200':
          description: Stores sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'
    post:
      summary: Create a store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreInput'
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '422':
          description: Invalid request

  /store/{id}:
    get:
      summary: Get store by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Store found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '404':
          description: Store not found
    put:
      summary: Update a store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreInput'
      responses:
        '200':
          description: Store updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '404':
          description: Store not found
        '422':
          description: Invalid request
    patch:
      summary: Partially update a store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreInput'
      responses:
        '200':
          description: Store patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '404':
          description: Store not found
        '422':
          description: Invalid request
    delete:
      summary: Delete a store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Store deleted
        '404':
          description: Store not found

components:
  schemas:
    Store:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: TONSTAD
        quantityProductsInStock:
          type: integer
          example: 10
    StoreInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: TONSTAD
        quantityProductsInStock:
          type: integer
          example: 10
